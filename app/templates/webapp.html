<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MX Nasiya — Шахсий кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ─────────────────────────────────────────────────────────────────────
   Tokens.  Base surfaces follow the Telegram theme; brand + status colors
   are ours: deep teal (calm money), mint (paid), amber (soon), coral (late).
   ───────────────────────────────────────────────────────────────────── */
:root {
  --bg: #0f1115; --surface: #181b21; --surface-2: #20242c; --line: #2a2f38;
  --text: #f3f4f6; --muted: #9aa3b2; --faint: #6b7280;
  --brand: #14b8a6; --brand-ink: #0b0f14; --brand-soft: rgba(20,184,166,.14);
  --paid: #34d399; --soon: #fbbf24; --late: #fb7185; --link: #60a5fa;
  --paid-soft: rgba(52,211,153,.14); --soon-soft: rgba(251,191,36,.16); --late-soft: rgba(251,113,133,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
  --r: 18px; --r-sm: 12px; --tap: 48px;
  --ease: cubic-bezier(.22,.61,.36,1); --spring: cubic-bezier(.34,1.4,.64,1);
}
body.light {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f0f3f6; --line: #e5e9ef;
  --text: #0f172a; --muted: #5b6472; --faint: #94a3b8;
  --brand: #0f766e; --brand-ink: #ffffff; --brand-soft: rgba(15,118,110,.10);
  --paid: #059669; --soon: #b45309; --late: #dc2626; --link: #2563eb;
  --paid-soft: rgba(5,150,105,.10); --soon-soft: rgba(180,83,9,.12); --late-soft: rgba(220,38,38,.10);
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 10px 30px -14px rgba(15,23,42,.18);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
  min-height: 100dvh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); overflow-x: hidden;
  transition: background .25s var(--ease), color .25s var(--ease);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums lining-nums; letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── shell ─────────────────────────────────────────────────────────── */
.top {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.brand .mark { width: 34px; height: 34px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: .02em; flex-shrink: 0; }
.brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
.pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--soon-soft); color: var(--soon); letter-spacing: .04em; }
.top .id { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar button {
  position: relative; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600;
  min-height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  transition: color .2s var(--ease), transform .2s var(--spring);
}
.tabbar button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s var(--spring); }
.tabbar button.active { color: var(--brand); }
.tabbar button.active svg { transform: translateY(-1px) scale(1.06); }
.tabbar button.active::before { content: ""; position: absolute; top: 2px; width: 22px; height: 3px; border-radius: 3px; background: var(--brand); animation: pop .3s var(--spring); }
.tabbar button:active { transform: scale(.94); }
.tabbar button.pay { color: var(--brand-ink); }
.tabbar button.pay .fab { width: 46px; height: 46px; border-radius: 16px; background: var(--brand); display: grid; place-items: center; box-shadow: 0 8px 20px -6px color-mix(in srgb, var(--brand) 70%, transparent); transform: translateY(-10px); transition: transform .25s var(--spring); }
.tabbar button.pay .fab { color: #fff; }
.tabbar button.pay .fab svg { stroke: #fff; width: 24px; height: 24px; }
.tabbar button.pay span:not(.fab) { color: var(--muted); margin-top: -8px; }
.tabbar button.pay.active span { color: var(--brand); }
.tabbar button.pay.active::before { display: none; }
.tabbar button.pay:active .fab { transform: translateY(-10px) scale(.94); }

.rail { display: none; }
@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; gap: 4px; position: fixed; left: 0; top: 0; bottom: 0; width: 248px; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--line); z-index: 40; }
  .rail .brand { flex: 0 0 auto; padding: 4px 8px 18px; }
  .rail button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: var(--muted); padding: 11px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: left; transition: background .15s, color .15s, transform .15s var(--spring); }
  .rail button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .rail button:hover { background: var(--surface-2); color: var(--text); }
  .rail button.active { background: var(--brand-soft); color: var(--brand); }
  .rail .spacer { flex: 1; }
  .rail .out { color: var(--late); }
  .top, .view { margin-left: 248px; }
}

.view { display: none; padding: 16px 16px 24px; max-width: 720px; margin-inline: auto; min-width: 0; }
.tile .n, .hero .big, .kv .v { overflow-wrap: anywhere; }
.view.active { display: block; animation: enter .32s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.stagger > * { animation: rise .4s var(--ease) both; }
.stagger > *:nth-child(1){animation-delay:.02s}.stagger > *:nth-child(2){animation-delay:.07s}.stagger > *:nth-child(3){animation-delay:.12s}.stagger > *:nth-child(4){animation-delay:.17s}.stagger > *:nth-child(5){animation-delay:.22s}.stagger > *:nth-child(6){animation-delay:.27s}.stagger > *:nth-child(n+7){animation-delay:.3s}

/* ── components ────────────────────────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.tap { cursor: pointer; transition: transform .18s var(--spring), border-color .18s; }
.card.tap:hover { border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
.card.tap:active { transform: scale(.985); }
h2.t { font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 12px; }
h3.t { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); }
.kv .v { font-weight: 600; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); }
.tile .l { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tile .n { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.tile.paid .n { color: var(--paid); } .tile.late .n { color: var(--late); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.tag.active, .tag.pending { background: var(--brand-soft); color: var(--brand); }
.tag.overdue { background: var(--late-soft); color: var(--late); }
.tag.closed, .tag.paid { background: var(--paid-soft); color: var(--paid); }
.bar { height: 8px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--brand), var(--paid)); width: 0; transition: width .9s var(--ease); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: var(--tap); padding: 12px 18px; border: 0; border-radius: 14px; font-size: 15px; font-weight: 700; transition: transform .15s var(--spring), filter .15s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--brand) 80%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.line { background: transparent; color: var(--text); border: 1.5px solid var(--line); }
.btn.danger { background: transparent; color: var(--late); border: 1.5px solid color-mix(in srgb, var(--late) 40%, transparent); }
.btn.sm { min-height: 38px; padding: 8px 14px; font-size: 13px; width: auto; border-radius: 11px; }
.btns { display: flex; gap: 10px; margin-top: 12px; }
.btns .btn { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; transition: all .18s var(--ease); }
.chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input { width: 100%; min-height: var(--tap); padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
textarea.input { min-height: 110px; resize: vertical; }
.note { padding: 11px 13px; border-radius: var(--r-sm); font-size: 13px; line-height: 1.45; margin-bottom: 10px; display: flex; gap: 8px; align-items: flex-start; }
.note.err { background: var(--late-soft); color: var(--late); } .note.ok { background: var(--paid-soft); color: var(--paid); }
.note.info { background: var(--brand-soft); color: var(--brand); } .note.warn { background: var(--soon-soft); color: var(--soon); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .em { font-size: 40px; margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }
.back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 6px 0 2px; border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 14px; margin-bottom: 6px; border-radius: 10px; }
.back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 99; padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 600; color: #fff; background: #0f172a; box-shadow: 0 12px 30px -8px rgba(0,0,0,.5); opacity: 0; transition: all .3s var(--spring); max-width: 92vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--late); }
@media (min-width: 900px) { .toast { bottom: 28px; } }

/* skeleton */
.sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 10px; }
.sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 8%, transparent), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
.sk-card { border-radius: var(--r); padding: 16px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 12px; }
.sk-line { height: 12px; margin-bottom: 10px; }

/* hero: debt ring (signature) */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px; margin-bottom: 12px; box-shadow: var(--shadow); display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: -40% auto auto -20%; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, var(--brand-soft), transparent 70%); pointer-events: none; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
.ring .track { stroke: var(--surface-2); }
.ring .fill { stroke: var(--brand); stroke-dasharray: 339.3; stroke-dashoffset: 339.3; transition: stroke-dashoffset 1.2s var(--ease); }
.ring .fill.late { stroke: var(--late); }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .c b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.ring .c small { font-size: 11px; color: var(--muted); font-weight: 600; }
.hero .info .eyebrow { margin-bottom: 4px; }
.hero .big { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin-bottom: 8px; }
.hero .next { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; font-weight: 600; background: var(--brand-soft); color: var(--brand); }
.hero .next.late { background: var(--late-soft); color: var(--late); }
.hero .next.ok { background: var(--paid-soft); color: var(--paid); }
@media (max-width: 360px) { .hero { grid-template-columns: 1fr; text-align: center; } .ring { margin-inline: auto; } }

/* timeline schedule (signature 2) */
.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px; background: var(--line); border-radius: 2px; }
.tl .it { position: relative; padding: 8px 0 8px 6px; display: flex; align-items: center; gap: 10px; }
.tl .it + .it { border-top: 1px solid var(--line); }
.tl .dot { position: absolute; left: -23px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 2.5px solid var(--faint); }
.tl .it.paid .dot { background: var(--paid); border-color: var(--paid); }
.tl .it.overdue .dot { background: var(--late); border-color: var(--late); box-shadow: 0 0 0 4px var(--late-soft); }
.tl .it.next .dot { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); animation: pulse 1.8s infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--brand-soft);} 50% { box-shadow: 0 0 0 8px transparent;} }
.tl .d { flex: 1; min-width: 0; }
.tl .d b { display: block; font-size: 14px; }
.tl .d small { display: block; font-size: 12px; color: var(--muted); }
.tl .a { font-weight: 800; white-space: nowrap; }
.tl .it.paid .a { color: var(--paid); } .tl .it.overdue .a { color: var(--late); }

/* pay flow */
.steps { display: flex; align-items: center; gap: 6px; margin: 2px 0 14px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); transition: background .3s; }
.steps span.on { background: var(--brand); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface-2); margin-bottom: 8px; cursor: pointer; transition: all .18s var(--ease); }
.opt:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); }
.opt .l b { display: block; font-size: 14px; } .opt .l small { color: var(--muted); font-size: 12px; }
.opt .a { font-weight: 800; white-space: nowrap; }
.opt .chk { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; transition: all .18s; }
.opt.sel .chk { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.opt .chk svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 3; opacity: 0; }
.opt.sel .chk svg { opacity: 1; }
.pm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 12px; }
.pm button { min-height: 76px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 13px; transition: all .18s var(--ease); }
.pm button .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; }
.pm button.sel { border-color: var(--pm-color); background: color-mix(in srgb, var(--pm-color) 12%, var(--surface)); transform: translateY(-2px); }
.receipt { position: relative; background: var(--surface-2); border-radius: 14px; padding: 14px 16px; font-variant-numeric: tabular-nums; }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 12px; background: radial-gradient(circle, var(--bg) 4px, transparent 5px) 0 0/16px 12px repeat-x; }
.receipt .kv { padding: 7px 0; }
.check { width: 72px; height: 72px; border-radius: 50%; background: var(--paid-soft); color: var(--paid); display: grid; place-items: center; margin: 4px auto 12px; animation: pop2 .5s var(--spring); }
.check svg { width: 36px; height: 36px; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .2s var(--ease) forwards; }
@keyframes pop2 { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.menu .card { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.menu .em { width: 42px; height: 42px; border-radius: 13px; background: var(--surface-2); display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
.menu .t { flex: 1; min-width: 0; } .menu .t b { display: block; font-size: 15px; } .menu .t small { color: var(--muted); font-size: 12.5px; }
.menu .arr { color: var(--faint); }
.promo { border-left: 4px solid var(--brand); }
.promo.promo-promo { border-left-color: var(--soon); } .promo.promo-new { border-left-color: var(--paid); } .promo.promo-special { border-left-color: #a78bfa; } .promo.promo-news { border-left-color: var(--link); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
a.lnk { color: var(--link); text-decoration: none; font-weight: 600; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<aside class="rail" id="rail" aria-label="Асосий меню">
  <div class="brand"><div class="mark">MX</div><div><h1 id="railName">MX Nasiya</h1><small>Шахсий кабинет</small></div></div>
  <div id="railMenu"></div>
  <div class="spacer"></div>
  <button class="out" onclick="doLogout()" id="railOut" style="display:none"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Чиқиш</span></button>
</aside>

<header class="top">
  <div class="brand"><div class="mark">MX</div><div style="min-width:0"><h1 id="companyName">MX Nasiya</h1><small>Насия бўйича шахсий кабинет</small></div></div>
  <span class="pill" id="mockBadge" style="display:none" title="Тест маълумотлари">ДЕМО</span>
  <span class="id num" id="headerUserInfo"></span>
</header>

<main>
  <section id="viewCabinet" class="view active" aria-live="polite"></section>
  <section id="viewDebt" class="view"></section>
  <section id="viewSchedule" class="view"></section>
  <section id="viewPay" class="view"></section>
  <section id="viewPayments" class="view"></section>
  <section id="viewPurchases" class="view"></section>
  <section id="viewHelp" class="view"></section>
  <section id="viewPromo" class="view"></section>
  <section id="viewMore" class="view"></section>
  <section id="viewRegister" class="view"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Пастки меню"></nav>
<div class="toast" id="toast" role="status"></div>

<script>
/* ── Telegram bridge ───────────────────────────────────────────────── */
const Tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {
  initData: '', colorScheme: 'light', themeParams: {}, ready(){}, expand(){}, onEvent(){}, openLink(u){ window.open(u, '_blank'); },
  HapticFeedback: { notificationOccurred(){}, impactOccurred(){} }, BackButton: { show(){}, hide(){}, onClick(){} },
};
try { Tg.ready(); Tg.expand(); } catch (e) {}
const haptic = (k) => { try { k === 'tap' ? Tg.HapticFeedback.impactOccurred('light') : Tg.HapticFeedback.notificationOccurred(k); } catch (e) {} };

const baseUrl = location.origin + location.pathname.replace(/\/[^/]*$/, '');
const qp = new URLSearchParams(location.search);
const botId = qp.get('bot_id') || '1';
const sessionToken = qp.get('session') || '';
const initData = Tg.initData || '';

let user = null, page = 'cabinet', contractsCache = null;
let pay = {}, sched = { contract_id: null, status: 'all' };

/* ── icons ─────────────────────────────────────────────────────────── */
const I = {
  cabinet: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
  debt: '<svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19M6.5 15h3"/></svg>',
  schedule: '<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M8 15h.01M12 15h.01M16 15h.01"/></svg>',
  pay: '<svg viewBox="0 0 24 24"><path d="M12 5v14M8.5 8.5c0-1.4 1.6-2.3 3.5-2.3s3.5.9 3.5 2.3-1.6 2-3.5 2.4-3.5 1-3.5 2.4 1.6 2.3 3.5 2.3 3.5-.9 3.5-2.3"/></svg>',
  payments: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
  purchases: '<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg>',
  help: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',
  promo: '<svg viewBox="0 0 24 24"><path d="M3 9h18v3H3zM5 12v8h14v-8M12 9v11M12 9c-1.5 0-4-.7-4-2.7S10.5 3 12 6.3M12 9c1.5 0 4-.7 4-2.7S13.5 3 12 6.3"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
  chev: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  ok: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
};
const TABS = [['cabinet','Кабинет'], ['debt','Қарзим'], ['pay','Тўлаш'], ['schedule','График'], ['more','Кўпроқ']];
const RAIL = [['cabinet','Кабинет'], ['debt','Қарзим'], ['schedule','Графигим'], ['pay','Тўлов қилиш'], ['payments','Тўловлар'], ['purchases','Харидлар'], ['promo','Акциялар'], ['help','Ёрдам']];
document.getElementById('tabbar').innerHTML = TABS.map(([k, l]) => k === 'pay'
  ? `<button class="pay" id="tab_${k}" onclick="go('${k}')" aria-label="${l}"><span class="fab">${I.pay}</span><span>${l}</span></button>`
  : `<button id="tab_${k}" onclick="go('${k}')">${I[k]}${l}</button>`).join('');
document.getElementById('railMenu').innerHTML = RAIL.map(([k, l]) => `<button data-page="${k}" onclick="go('${k}')">${I[k]}<span>${l}</span></button>`).join('');

/* ── api ───────────────────────────────────────────────────────────── */
function apiUrl(path) {
  const sep = path.includes('?') ? '&' : '?';
  let u = `${baseUrl}/webapp/api${path}${sep}bot_id=${botId}`;
  if (sessionToken) u += `&session=${encodeURIComponent(sessionToken)}`;
  return u;
}
async function api(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (initData) headers['X-Telegram-Init-Data'] = initData;
  const r = await fetch(apiUrl(path), { method, headers, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || 'Хатолик юз берди. Қайта уриниб кўринг.');
  return d;
}

/* ── theme ─────────────────────────────────────────────────────────── */
function applyTheme() {
  const scheme = Tg.colorScheme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.body.classList.toggle('light', scheme === 'light');
  const p = Tg.themeParams || {};
  const map = { bg_color: '--bg', text_color: '--text', hint_color: '--muted', section_bg_color: '--surface', secondary_bg_color: '--surface-2' };
  for (const k in map) if (p[k]) document.documentElement.style.setProperty(map[k], p[k]);
}
applyTheme(); Tg.onEvent('themeChanged', applyTheme);

/* ── helpers ───────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => `<span class="num">${Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ')}</span> сўм`;
const moneyT = n => Number(n || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' сўм';
const ST = { active: 'Фаол', overdue: 'Кечиккан', closed: 'Ёпилган', paid: 'Тўланган', pending: 'Кутилмоқда' };
const days = d => d == null ? '' : d < 0 ? `${-d} кун кечикди` : d === 0 ? 'бугун' : d === 1 ? 'эртага' : `${d} кундан кейин`;
const note = (t, m) => `<div class="note ${t}">${m}</div>`;
const skeleton = (n = 3) => Array.from({ length: n }, () => `<div class="sk-card"><div class="sk sk-line" style="width:45%"></div><div class="sk sk-line" style="width:80%"></div><div class="sk sk-line" style="width:60%;margin:0"></div></div>`).join('');
const load = id => { $(id).innerHTML = skeleton(); };
const empty = (em, b, s, act = '') => `<div class="empty"><div class="em">${em}</div><b>${b}</b><span>${s}</span>${act}</div>`;
let toastT;
function toast(msg, type) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (type === 'err' ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); haptic(type === 'err' ? 'error' : 'success');
}
function setHeader(company, id) {
  $('companyName').textContent = company || 'MX Nasiya'; $('railName').textContent = company || 'MX Nasiya';
  $('headerUserInfo').textContent = id ? '№ ' + id : '';
}
function ring(pct, late) {
  const off = 339.3 * (1 - Math.min(100, Math.max(0, pct)) / 100);
  return `<div class="ring" role="img" aria-label="Тўланган ${pct}%"><svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="fill ${late ? 'late' : ''}" cx="60" cy="60" r="54" data-off="${off}"/></svg><div class="c"><div><b class="num">${pct}%</b><small>тўланган</small></div></div></div>`;
}
function animateBars(root) {
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelectorAll('.bar > i').forEach(b => b.style.width = b.dataset.w + '%');
    root.querySelectorAll('.ring .fill').forEach(c => c.style.strokeDashoffset = c.dataset.off);
  }));
}
function backBtn(label, fn) { return `<button class="back" onclick="${fn}">${I.chev}${label}</button>`; }

/* ── routing ───────────────────────────────────────────────────────── */
function go(name, arg) {
  if (!user) return;
  if (!user.registered && name !== 'register') name = 'register';
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tabbar button, .rail button').forEach(b => b.classList.remove('active'));
  const v = $('view' + name[0].toUpperCase() + name.slice(1)); if (v) { v.classList.remove('active'); void v.offsetWidth; v.classList.add('active'); }
  const tabKey = ['payments', 'purchases', 'help', 'promo'].includes(name) ? 'more' : name;
  $('tab_' + tabKey)?.classList.add('active');
  document.querySelector(`.rail button[data-page="${name}"]`)?.classList.add('active');
  page = name; window.scrollTo({ top: 0 }); haptic('tap');
  try { history.replaceState(null, '', '#' + name + (arg ? '/' + arg : '')); } catch (e) {}
  ({ cabinet: loadCabinet, debt: loadDebt, schedule: loadSchedule, pay: loadPay, payments: loadPayments, purchases: loadPurchases, help: loadHelp, promo: () => loadPromo('all'), more: loadMore, register: showRegister })[name]?.(arg);
}

/* ── register / logout ─────────────────────────────────────────────── */
function showRegister() {
  $('viewRegister').innerHTML = `
    <div class="stagger">
    <div class="card" style="text-align:center;padding:26px 18px">
      <div style="width:64px;height:64px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:22px;margin:0 auto 14px">MX</div>
      <h2 class="t" style="margin-bottom:6px">Хуш келибсиз</h2>
      <p style="color:var(--muted);font-size:14px">Насия бўйича шахсий кабинетга кириш учун телефон рақамингизни тасдиқланг.</p>
    </div>
    <div class="card">
      <div class="field"><label for="regPhone">Телефон рақам</label><input class="input num" type="tel" inputmode="numeric" id="regPhone" placeholder="998 90 123 45 67" value="${esc(user.phone_number || '')}" autocomplete="tel"></div>
      <div id="regError"></div>
      <button class="btn primary" onclick="doRegister()">Кириш</button>
      <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px">Рақам компания базасидаги мижоз рақами билан мос бўлиши керак.</p>
    </div></div>`;
  setTimeout(() => $('regPhone')?.focus(), 250);
  $('regPhone').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
}
async function doRegister() {
  const phone = $('regPhone').value.trim();
  if (!phone) { $('regError').innerHTML = note('err', 'Телефон рақамни киритинг.'); $('regPhone').focus(); return; }
  const btn = document.querySelector('#viewRegister .btn'); btn.disabled = true; btn.textContent = 'Текширилмоқда…';
  try {
    const r = await api('POST', '/register', { phone_number: phone });
    user.registered = true; user.phone_number = phone; user.client_id = r.client_id; contractsCache = null;
    setHeader(user.company_name, r.client_id); $('railOut').style.display = '';
    toast('Хуш келибсиз' + (r.name ? ', ' + r.name.split(' ')[0] : '') + '!');
    go('cabinet');
  } catch (e) { $('regError').innerHTML = note('err', esc(e.message)); btn.disabled = false; btn.textContent = 'Кириш'; }
}
async function doLogout() {
  if (!confirm('Тизимдан чиқасизми?')) return;
  try {
    await api('POST', '/logout');
    user.registered = false; user.client_id = null; contractsCache = null;
    setHeader(user.company_name, null); $('railOut').style.display = 'none';
    go('register');
  } catch (e) { toast(e.message, 'err'); }
}

/* ── cabinet ───────────────────────────────────────────────────────── */
async function loadCabinet() {
  load('viewCabinet');
  try {
    const c = await api('GET', '/cabinet');
    const nxt = c.next_payment, late = c.overdue_amount > 0;
    const pct = c.total_nasiya ? Math.min(100, Math.round(c.total_paid / c.total_nasiya * 100)) : 0;
    const status = late ? `<span class="next late">● Муддати ўтган: ${moneyT(c.overdue_amount)}</span>`
      : nxt ? `<span class="next">⏭ ${moneyT(nxt.amount)} · ${nxt.date}</span>`
      : `<span class="next ok">✓ Барча тўловлар амалга оширилган</span>`;
    const first = (c.name || '').split(' ')[0];
    $('viewCabinet').innerHTML = `<div class="stagger">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 12px">
        <div><div class="eyebrow">Салом${first ? ', ' + esc(first) : ''}</div><h2 class="t" style="margin:2px 0 0">Кабинет</h2></div>
        <span class="tag ${late ? 'overdue' : 'active'}">${esc(c.status || 'Мижоз')}</span>
      </div>
      <div class="hero">
        ${ring(pct, late)}
        <div class="info"><div class="eyebrow">Қолган қарз</div><div class="big num">${money(c.remaining_debt)}</div>${status}</div>
      </div>
      <div class="grid2">
        <div class="tile"><div class="l">Амалдаги шартномалар</div><div class="n num">${c.active_contracts} <span style="font-weight:500;color:var(--muted);font-size:13px">/ ${c.total_contracts}</span></div></div>
        <div class="tile"><div class="l">Умумий насия</div><div class="n">${money(c.total_nasiya)}</div></div>
        <div class="tile paid"><div class="l">Тўланган</div><div class="n">${money(c.total_paid)}</div></div>
        <div class="tile ${late ? 'late' : ''}"><div class="l">Муддати ўтган</div><div class="n">${money(c.overdue_amount)}</div></div>
      </div>
      <div class="btns" style="margin:0 0 12px"><button class="btn primary" onclick="go('pay')">${I.pay} Тўлов қилиш</button><button class="btn ghost" onclick="go('debt')">Шартномалар</button></div>
      <div class="card">
        <h3 class="t">Шахсий маълумотлар</h3>
        <div class="kv"><span class="k">Ф.И.О</span><span class="v">${esc(c.name || '—')}</span></div>
        <div class="kv"><span class="k">Телефон</span><span class="v num">${c.phone ? '+' + esc(c.phone) : '—'}</span></div>
        <div class="kv"><span class="k">Мижоз рақами</span><span class="v num">${esc(c.client_id)}</span></div>
        <div class="kv"><span class="k">Мижоз бўлган сана</span><span class="v num">${esc(c.registered_at || '—')}</span></div>
        <div class="kv"><span class="k">Эслатмалар</span><span class="v"><button class="btn sm ${c.reminders_enabled ? 'line' : 'primary'}" onclick="toggleReminders(${!c.reminders_enabled})">${c.reminders_enabled ? '🔔 Ёқилган · ўчириш' : '🔕 Ўчирилган · ёқиш'}</button></span></div>
      </div>
      <button class="btn danger" onclick="doLogout()">Чиқиш</button>
    </div>`;
    animateBars($('viewCabinet'));
  } catch (e) { $('viewCabinet').innerHTML = note('err', esc(e.message)); }
}
async function toggleReminders(on) {
  try { await api('POST', '/reminders', { enabled: on }); toast(on ? 'Эслатмалар ёқилди' : 'Эслатмалар ўчирилди'); loadCabinet(); } catch (e) { toast(e.message, 'err'); }
}

/* ── debt / contracts ──────────────────────────────────────────────── */
async function contracts(force) { if (!contractsCache || force) contractsCache = await api('GET', '/contracts'); return contractsCache; }
function contractCard(c, onclick) {
  const paidTotal = c.paid + c.initial_payment, pct = c.total ? Math.min(100, Math.round(paidTotal / c.total * 100)) : 0;
  return `<div class="card tap" role="button" tabindex="0" onclick="${onclick}" onkeydown="if(event.key==='Enter')this.click()">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px"><b>${esc(c.number)}</b><span class="tag ${c.status}">${ST[c.status]}</span></div>
    <div style="font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.products.map(p => esc(p.name)).join(' · ')}</div>
    <div class="bar"><i data-w="${pct}"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:13px;gap:8px"><span style="color:var(--muted)">Тўланган ${pct}%</span><b>Қарз: ${money(c.remaining_debt)}</b></div>
    ${c.next_payment_date ? `<div style="font-size:12.5px;color:var(--muted);margin-top:6px">⏭ Кейинги: ${money(c.next_payment_amount)} · ${c.next_payment_date} <span style="color:${c.days_to_next < 0 ? 'var(--late)' : 'inherit'}">(${days(c.days_to_next)})</span></div>` : ''}
  </div>`;
}
async function loadDebt(id) {
  if (id) return loadContract(id);
  load('viewDebt');
  try {
    const d = await contracts(true);
    if (!d.contracts.length) return $('viewDebt').innerHTML = empty('📄', 'Шартномалар йўқ', 'Сизда ҳали насия шартномалари мавжуд эмас.');
    const late = d.overdue_amount > 0;
    $('viewDebt').innerHTML = `<div class="stagger">
      <h2 class="t">Қарзим</h2>
      <div class="hero" style="grid-template-columns:1fr">
        <div class="info"><div class="eyebrow">Умумий қолган қарз</div><div class="big">${money(d.total_debt)}</div>
        <span class="next ${late ? 'late' : ''}">${late ? '● Муддати ўтган: ' + moneyT(d.overdue_amount) : '📄 Фаол шартномалар: ' + d.active_count + ' та'}</span></div>
      </div>
      <div class="eyebrow" style="margin:6px 2px 8px">Шартномалар · ${d.contracts.length}</div>
      ${d.contracts.map(c => contractCard(c, `go('debt', ${c.contract_id})`)).join('')}
      <button class="btn primary" onclick="go('pay')">${I.pay} Тўлов қилиш</button>
    </div>`;
    animateBars($('viewDebt'));
  } catch (e) { $('viewDebt').innerHTML = note('err', esc(e.message)); }
}
async function loadContract(id) {
  load('viewDebt');
  try {
    const c = await api('GET', `/contracts/${id}`);
    const paidTotal = c.paid + c.initial_payment, pct = c.total ? Math.min(100, Math.round(paidTotal / c.total * 100)) : 0;
    $('viewDebt').innerHTML = `${backBtn('Шартномалар', "go('debt')")}<div class="stagger">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="t" style="margin:0">${esc(c.number)}</h2><span class="tag ${c.status}">${ST[c.status]}</span></div>
        <div style="font-size:13px;color:var(--muted);margin:4px 0 12px">${c.date} · ${esc(c.branch || '')}</div>
        <div class="bar" style="margin-top:0"><i data-w="${pct}"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--muted)">${pct}% тўланган · ${c.paid_count}/${c.months} тўлов</span><b style="color:var(--late)">${money(c.remaining_debt)}</b></div>
      </div>
      <div class="card"><div class="eyebrow" style="margin-bottom:8px">Товарлар</div>
        ${c.products.map(p => `<div class="kv"><span>${esc(p.name)} <span style="color:var(--muted)">× ${p.qty}</span></span><span class="v">${money(p.sum)}</span></div>`).join('')}
      </div>
      <div class="card"><div class="eyebrow" style="margin-bottom:8px">Шартнома шартлари</div>
        <div class="kv"><span class="k">Насия суммаси</span><span class="v">${money(c.total)}</span></div>
        <div class="kv"><span class="k">Бошланғич тўлов</span><span class="v">${money(c.initial_payment)}</span></div>
        <div class="kv"><span class="k">Муддат</span><span class="v">${c.months} ой · ойига ${money(c.monthly_payment)}</span></div>
        <div class="kv"><span class="k">Якуний сана</span><span class="v num">${c.end_date}</span></div>
        <div class="kv"><span class="k">Тўланган</span><span class="v" style="color:var(--paid)">${money(paidTotal)}</span></div>
        <div class="kv"><span class="k">Қолган қарз</span><span class="v" style="color:var(--late)">${money(c.remaining_debt)}</span></div>
        ${c.overdue_amount > 0 ? `<div class="kv"><span class="k">Муддати ўтган</span><span class="v" style="color:var(--late)">${money(c.overdue_amount)} · ${c.overdue_count} та</span></div>` : ''}
        ${c.next_payment_date ? `<div class="kv"><span class="k">Кейинги тўлов</span><span class="v">${money(c.next_payment_amount)}<br><small style="color:var(--muted);font-weight:500">${c.next_payment_date} · ${days(c.days_to_next)}</small></span></div>` : ''}
      </div>
      <div class="btns" style="margin-top:0"><button class="btn ghost" onclick="go('schedule', ${c.contract_id})">${I.schedule} График</button>${c.status !== 'closed' ? `<button class="btn primary" onclick="go('pay', ${c.contract_id})">${I.pay} Тўлаш</button>` : ''}</div>
    </div>`;
    animateBars($('viewDebt'));
  } catch (e) { $('viewDebt').innerHTML = note('err', esc(e.message)); }
}

/* ── schedule ──────────────────────────────────────────────────────── */
async function loadSchedule(id) {
  load('viewSchedule');
  try {
    if (id === undefined || id === null) {
      const d = await contracts();
      if (!d.contracts.length) return $('viewSchedule').innerHTML = empty('📅', 'График йўқ', 'Шартнома бўлмаганда тўлов графиги ҳам бўлмайди.');
      if (d.contracts.length === 1) id = d.contracts[0].contract_id;
      else {
        $('viewSchedule').innerHTML = `<div class="stagger"><h2 class="t">Тўлов графиги</h2>

    $('viewPromo').innerHTML = `<h2 class="t">Акциялар ва хабарлар</h2>
      <div class="chips" role="tablist">${T.map(([k, l]) => `<button class="chip ${kind === k ? 'active' : ''}" onclick="loadPromo('${k}', true)">${l}</button>`).join('')}</div>
      <div class="stagger">${items.length ? items.map(i => `<div class="card promo promo-${i.type}"><b>${esc(i.title)}</b><p style="font-size:14px;margin-top:4px;color:var(--text)">${esc(i.text)}</p>${i.valid_until ? `<div style="font-size:12px;color:var(--muted);margin-top:8px">Муддати: ${esc(i.valid_until)}</div>` : ''}</div>`).join('') : empty('🎁', 'Ҳозирча йўқ', 'Янги акциялар пайдо бўлганда шу ерда кўринади.')}</div>`;
  } catch (e) { $('viewPromo').innerHTML = note('err', esc(e.message)); }
}

/* ── more ──────────────────────────────────────────────────────────── */
function loadMore() {
  const items = [['payments', '🧾', 'Тўловлар', 'Тарих ва квитанциялар'], ['purchases', '🛍', 'Харидлар', 'Товарлар ва шартномалар'], ['promo', '🎁', 'Акциялар', 'Янгиликлар ва таклифлар'], ['help', '📞', 'Ёрдам', 'Оператор, мурожаат, филиаллар']];
  $('viewMore').innerHTML = `<h2 class="t">Кўпроқ</h2><div class="menu stagger">${items.map(([k, e, t, s]) => `<div class="card tap" role="button" tabindex="0" onclick="go('${k}')" onkeydown="if(event.key==='Enter')this.click()"><span class="em">${e}</span><span class="t"><b>${t}</b><small>${s}</small></span><span class="arr">›</span></div>`).join('')}
    <button class="btn danger" onclick="doLogout()">Чиқиш</button></div>`;
}

/* ── init ──────────────────────────────────────────────────────────── */
async function init() {
  load('viewCabinet');
  try {
    user = await api('GET', '/user');
    setHeader(user.company_name, user.client_id);
    if (user.mock) $('mockBadge').style.display = '';
    if (user.registered) $('railOut').style.display = '';
    const [h, harg] = (location.hash || '').slice(1).split('/');
    const known = ['cabinet','debt','schedule','pay','payments','purchases','help','promo','more'];
    go(user.registered ? (known.includes(h) ? h : 'cabinet') : 'register', harg ? Number(harg) : undefined);
  } catch (e) {
    $('viewCabinet').innerHTML = empty('🔒', 'Кириш имкони йўқ', esc(e.message) + '. Ботда /getsession буйруғи орқали янги ҳавола олинг ёки илова­ни Telegram ичидан очинг.');
  }
}
init();
</script>
